services:
  timetable:
    build: .
    image: bahn-api:latest
    container_name: timetable_app
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
    ports:
      - "5123:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
